name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Seed, build every model, run all 28 tests
        run: python kpi.py build
      - name: Exports are up to date with the models
        run: |
          python kpi.py export
          git diff --exit-code exports/
