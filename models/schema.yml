version: 2

models:
  - name: stg_invoice_lines
    description: One row per invoice line, duplicates from the ERP export removed.
    columns:
      - name: invoice_id
        tests: [not_null]
      - name: currency
        tests:
          - accepted_values:
              values: [DKK, EUR, USD, JPY]

  - name: int_invoice_lines_dkk
    description: Invoice lines converted to DKK with cost of goods sold.
    columns:
      - name: revenue_dkk
        description: Null here means a currency or month with no exchange rate.
        tests: [not_null]
      - name: cogs_dkk
        tests: [not_null]

  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: segment
        tests:
          - accepted_values:
              values: [Research, Industrial, Medical]

  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date
        tests: [unique, not_null]

  - name: fct_invoice_lines
    description: Revenue and margin fact table, one row per invoice line.
    columns:
      - name: invoice_line_key
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: invoice_date
        tests:
          - relationships:
              to: ref('dim_date')
              field: date

  - name: fct_receivables
    description: Open and paid invoices at the reporting date.
    columns:
      - name: invoice_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              values: [Paid, Open, Overdue]

  - name: kpi_monthly
    columns:
      - name: month
        tests: [unique, not_null]
      - name: dso_days
        tests: [not_null]
